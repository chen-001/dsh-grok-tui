name: CI

# Runs on every push to ANY branch and on every pull request: one workflow
# file covers all branches (including future feat/* branches), so a branch
# pushed for GitHub-install testing is verified before anyone installs it.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # auto-install-peers=false must match the committed lockfile settings
        # (peer @deepseek-ai/* packages come from the dsh snapshot's tsconfig
        # paths, never from the registry).
        run: pnpm install --config.auto-install-peers=false

      # The tests import unpublished @deepseek-ai/* workspace packages. They
      # resolve through the tsconfig paths generated from a PINNED dsh
      # checkout (the same mechanism the local dev environment uses with
      # ~/.dsh/source/current). The commit below is the dsh snapshot the
      # test suite is developed against; bump it deliberately when the
      # suite needs a newer dsh.
      #
      # The checkout lives OUTSIDE the workspace (${{ runner.temp }}): rstest
      # globs **/*.{test,spec}.ts over the whole repo, and the dsh snapshot
      # contains hundreds of its own spec files (some with
      # `@vitest-environment jsdom` comments) that would otherwise be picked
      # up as tests of this project.
      - name: Checkout pinned dsh snapshot
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: ${{ runner.temp }}/dsh

      - name: Generate tsconfig.json from the dsh snapshot
        run: DSH_PATH="${{ runner.temp }}/dsh" node scripts/generate-tsconfig.mjs

      # Bare `cordis` / `schemastery` imports (src + tests) are not covered
      # by the tsconfig paths; install the vendored builds from the npm
      # registry under their bare names, pinned to the snapshot's versions.
      - name: Install vendored cordis/schemastery aliases
        run: pnpm add -D cordis@npm:@deepseek-ai/cordis@4.0.1-rc.1 schemastery@npm:@deepseek-ai/schemastery@3.18.1-rc.1

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm exec biome lint .

      - name: Build
        run: DSH_PATH="${{ runner.temp }}/dsh" pnpm build
